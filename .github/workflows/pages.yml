name: Deploy kalkulator ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/bangun_situs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job terpisah: deploy baru dimulai setelah artefak selesai diunggah dan tercatat.
  # Dalam satu job, deploy-pages kadang menanyakan artefak terlalu cepat
  # ("Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            web
            scripts
      - name: Bangun situs statis
        run: python3 scripts/bangun_situs.py site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
